name: Deploy API (Cloudflare Worker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"

permissions:
  contents: read

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deployment configuration
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          reason=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            reason="Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository secrets."
          elif grep -q "00000000-0000-0000-0000-000000000000" worker/wrangler.jsonc; then
            reason="Replace the placeholder D1 database_id in worker/wrangler.jsonc."
          elif ! grep -q '"DISCORD_CLIENT_ID": "[0-9]' worker/wrangler.jsonc; then
            reason="Set DISCORD_CLIENT_ID in worker/wrangler.jsonc."
          fi

          if [ -n "$reason" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=API deploy skipped::$reason"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mdc-hub --remote --config worker/wrangler.jsonc

      - name: Deploy Worker
        id: deploy
        if: steps.guard.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --config worker/wrangler.jsonc 2>&1 | tee /tmp/deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::Could not find the Worker URL in the deploy output."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### MDC HUB API deployed"
            echo ""
            echo "**Worker URL:** $URL"
            echo ""
            echo "**Discord redirect URI:** \`$URL/auth/discord/callback\`"
            echo ""
            echo "Next: add \`DISCORD_CLIENT_SECRET\` under Cloudflare -> Workers & Pages -> mdc-hub-api -> Settings -> Variables and Secrets, add the redirect URI in Discord, then set the Worker URL in \`public/config.json\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Print deployment details
        if: steps.guard.outputs.ready == 'true'
        run: |
          echo "Worker URL: ${{ steps.deploy.outputs.url }}"
          echo "Discord redirect URI: ${{ steps.deploy.outputs.url }}/auth/discord/callback"
