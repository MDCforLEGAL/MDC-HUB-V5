name: Probe script sources

on:
  push:
    paths:
      - .github/workflows/probe-sources.yml
      - scripts/probe-sources.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/probe-sources.mjs
      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-result.json
          git commit -m "chore: record script source probe" || true
          git push
