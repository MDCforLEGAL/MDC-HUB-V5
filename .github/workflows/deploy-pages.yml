name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Fallback only. The Cloudflare Worker cron dispatches this workflow every
    # 10 minutes because GitHub's scheduler is best-effort and can skip for hours.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-build
  cancel-in-progress: false

jobs:
  build:
    # Scheduled and manual runs always deploy. A generated sync commit is the
    # only push that is skipped, because that run already deployed the artifact.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      # "legacy" means GitHub already deploys the generated root when we push
      # it; only "workflow" repos need the explicit deploy job below.
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Pages publishing source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || true)
          if [ "$build_type" != "workflow" ] && [ "$build_type" != "legacy" ]; then
            echo "::warning::Could not read the Pages build type; assuming legacy branch deployment."
            build_type="legacy"
          fi
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "Pages build type: $build_type"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync live scripts
        id: sync
        env:
          RSCRIPTS_API_KEY: ${{ secrets.RSCRIPTS_API_KEY }}
        run: node scripts/sync-scripts.mjs

      - name: Build and publish repository root
        run: npm run build:pages

      - name: Commit generated GitHub Pages files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg .nojekyll assets config.json robots.txt sitemap.xml og-image.png
          if [ -d data ]; then git add data; fi
          git add public/data/scripts.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git commit -m "chore: update live script library and Pages build [skip ci]"
          git pull --rebase origin main
          git push

      - name: Upload Pages artifact
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
