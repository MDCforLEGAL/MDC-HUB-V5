<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04060a" />
    <script>
      try {
        if (localStorage.getItem("mdc-hub.theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
        if (localStorage.getItem("mdc-hub.graphics") === "low") {
          document.documentElement.dataset.graphics = "low";
        }
      } catch (error) {
        // Keep the default night theme when storage is unavailable.
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MDC HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="MDC HUB is a live, category-based Roblox script feed powered by the ScriptBlox catalog. Inspect source, status and code, then copy in one click."
    />
    <meta property="og:title" content="MDC HUB — Next-Gen Roblox Script Ecosystem" />
    <meta
      property="og:description"
      content="A live, category-based Roblox script catalog. Browse ScriptBlox-sourced scripts, check their status and copy in one click."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MDC HUB — Next-Gen Roblox Script Ecosystem</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
