<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <style>
      html { background: #0a0a0b; }
      html[data-theme="light"] { background: #f3f1ec; }
    </style>
    <script>
      try {
        if (localStorage.getItem("mdc-hub.theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
        if (localStorage.getItem("mdc-hub.graphics") === "low") {
          document.documentElement.dataset.graphics = "low";
        }
      } catch (error) {
        // Keep the default night theme when storage is unavailable.
      }
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MDC HUB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="MDC HUB — Roblox script arşivi. ScriptBlox, Rscripts ve topluluk kayıtlarını kategoriye göre incele; durum ve kaynak bilgisini kontrol et, tek tıkla kopyala."
    />
    <meta property="og:title" content="MDC HUB — Roblox Script Arşivi" />
    <meta
      property="og:description"
      content="ScriptBlox, Rscripts ve topluluk scriptlerini tek bir düzenli arşivde incele. Durum, kaynak ve erişim bilgisiyle birlikte."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MDC HUB — Roblox Script Arşivi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
